<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面宠物</title>
<style>
  @font-face {
    font-family: "Candy";
    src: url("../assets/fonts/candy.ttf") format("truetype");
    font-display: swap;
  }

  html, body {
    margin: 0;
    width: 520px;
    height: 362px;
    overflow: hidden;
    background: transparent;
    font-family: "Candy", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 视频舞台：640×360 的画面按 16:9 缩放，脚底对齐窗口底部 */
  #zoom {
    position: absolute; inset: 0;
    transform-origin: 260px 357px;
    will-change: transform;
  }
  #stage {
    position: absolute;
    left: 0;
    top: 86px;
    width: 520px;
    height: 292px;
    transform-origin: 50% 100%;
    will-change: transform;
  }
  #stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity .16s linear;
    pointer-events: none;
  }
  #stage video.front { opacity: 1; }

  /* 身体命中区（与主进程 HIT 保持一致，只用于光标样式） */
  #hit {
    position: absolute;
    left: 163px;
    top: 127px;
    width: 194px;
    height: 230px;
    cursor: grab;
  }
  #hit:active { cursor: grabbing; }

  /* 气泡 */
  #bubble {
    position: absolute;
    left: 50%;
    bottom: 268px;
    transform: translateX(-50%) translateY(6px) scale(.96);
    transform-origin: 50% 120%;
    max-width: 360px;
    padding: 9px 15px;
    background: rgba(255, 255, 255, .97);
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(31, 41, 66, .16), 0 1px 0 rgba(255, 255, 255, .8) inset;
    color: #2a3142;
    font-size: 16px;
    letter-spacing: .3px;
    line-height: 1.45;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .18s ease, transform .18s ease;
    pointer-events: none;
    z-index: 5;
  }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    margin-left: -7px;
    border: 7px solid transparent;
    border-top-color: rgba(255, 255, 255, .97);
    border-bottom: 0;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  /* 飘心 */
  .heart {
    position: absolute;
    font-size: 16px;
    pointer-events: none;
    z-index: 6;
    animation: floatUp 1.2s ease-out forwards;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .12));
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(.5); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-52px) scale(1.15); }
  }

  /* 状态滤镜 */
  #stage.dead video { filter: grayscale(1) brightness(.85); }
  #stage.sleeping { filter: saturate(.9); }

  /* 拖拽时轻微放大，给一点手感 */
  #stage.dragging { transform: scale(1.04); transition: transform .12s ease; }

  @keyframes landSquash {
    0% { transform: scale(1.06, .9); }
    55% { transform: scale(.98, 1.04); }
    100% { transform: scale(1, 1); }
  }
  #stage.land video { animation: landSquash .26s ease-out; }
</style>
</head>
<body>
  <div id="bubble"></div>
  <div id="zoom"><div id="stage">
    <video id="vA" muted playsinline preload="auto"></video>
    <video id="vB" muted playsinline preload="auto"></video>
  </div></div>
  <div id="hit"></div>
<script src="pet.js"></script>
</body>
</html>
