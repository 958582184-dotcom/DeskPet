<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>领养</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 420px; height: 400px; overflow: hidden; background: transparent; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #222836;
    padding: 10px;
    user-select: none;
    -webkit-user-select: none;
  }
  .card {
    width: 400px; height: 380px;
    background: #fff; border-radius: 22px;
    box-shadow: 0 20px 60px rgba(28, 39, 66, .25), 0 0 0 1px rgba(28, 39, 66, .06);
    padding: 26px 28px 20px;
    display: flex; flex-direction: column;
    -webkit-app-region: drag;
  }
  .card input, .card button, .card a { -webkit-app-region: no-drag; }

  .hero { display: flex; align-items: center; gap: 16px; }
  .hero img { width: 84px; height: 84px; object-fit: contain; }
  h1 { margin: 0; font-size: 21px; letter-spacing: .4px; }
  .sub { margin-top: 6px; color: #7d8699; font-size: 13px; line-height: 1.6; }

  .field { margin-top: 26px; }
  .field label { display: block; font-size: 12px; color: #8d96aa; margin-bottom: 7px; }
  .field input {
    width: 100%; padding: 11px 14px; font-size: 14px; color: #222836;
    border: 1px solid #e2e6ef; border-radius: 12px; outline: none;
    background: #f8f9fc; font-family: inherit;
  }
  .field input:focus { border-color: #5b7cfa; background: #fff; box-shadow: 0 0 0 3px rgba(91, 124, 250, .12); }

  .go {
    margin-top: 22px; width: 100%; padding: 13px 0; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, #6d8bff, #5b7cfa);
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 20px rgba(91, 124, 250, .35);
    font-family: inherit;
  }
  .go:hover { filter: brightness(1.05); }
  .go:active { transform: translateY(1px); }

  .note { margin-top: 14px; text-align: center; color: #a0a8b8; font-size: 11.5px; }
  .note a { color: #8d96aa; cursor: pointer; }
  .note a:hover { color: #5b7cfa; }
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <img src="../assets/avatar.png" alt="">
      <div>
        <h1>领养一只小宠物</h1>
        <div class="sub">它会住在你的桌面上，<br>会饿、会困、会想让你陪它玩。</div>
      </div>
    </div>

    <div class="field">
      <label for="name">给它起个名字</label>
      <input id="name" maxlength="8" value="小蓝" spellcheck="false" autocomplete="off">
    </div>

    <button class="go" id="ok">领养</button>
    <div class="note">领养后常驻托盘 · <a id="cancel">算了，退出</a></div>
  </div>

  <script src="adopt.js"></script>
</body>
</html>
